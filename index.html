<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="icon.webp" type="image/webp" />
<title>WoW Forever Boosting — GeGe Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0b0d;
    --bg2:#111114;
    --panel:#17171b;
    --panel2:#1f1f24;
    --panel3:#2b2b32;
    --line:#2e2e36;
    --line-soft:#232329;
    --fox:#f0762a;
    --fox-deep:#d35f17;
    --gold:#f2b84b;
    --ink:#f5f5f7;
    --ink-dim:#b4b4be;
    --ink-faint:#7c7c87;
    --alliance:#4a90d9;
    --horde:#d94a3d;
    --err:#ff7a6b;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:lining-nums}
  h1,h2,h3{font-weight:800;letter-spacing:-.01em;line-height:1.15}
  img{display:block;max-width:100%}
  a{color:var(--gold)}
  button{font:inherit;cursor:pointer;color:inherit}
  :focus-visible{outline:2px solid var(--fox);outline-offset:2px}
  [hidden]{display:none !important}

  /* Ảnh nền mờ phía trên trang */
  .page-art{position:absolute;inset:0 0 auto 0;height:620px;overflow:hidden;pointer-events:none;z-index:0}
  .page-art img{width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.36}
  .page-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.2),var(--bg) 92%),linear-gradient(90deg,var(--bg) 0,rgba(11,11,13,.4) 30%,rgba(11,11,13,.4) 70%,var(--bg))}

  /* ---------- thanh trên cùng ---------- */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px 20px;padding:14px 32px;background:rgba(11,11,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;flex:0 0 auto}
  .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}
  .brand .bname{display:block;font-weight:800;font-size:18px;line-height:1.1}
  .brand .bsub{display:block;font-size:11px;color:var(--ink-faint);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .searchbox{flex:1 1 260px;max-width:640px;min-width:0;position:relative}
  .searchbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
  .searchbox input[type="text"]{width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;color:var(--ink);padding:11px 14px 11px 44px;min-height:46px;font:inherit;font-size:15px}
  .searchbox input::placeholder{color:var(--ink-faint)}
  .searchbox input:focus{border-color:var(--fox);outline:none}
  .top-tools{display:flex;align-items:center;gap:10px;margin-left:auto}
  .lang-menu{position:relative}
  .lang-btn{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--ink);padding:8px 12px;min-height:44px;font-weight:800;font-size:13.5px;letter-spacing:.04em}
  .lang-btn:hover,.lang-btn[aria-expanded="true"]{background:var(--panel)}
  .lang-switch{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:250px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
  .lang-switch button{border:0;background:transparent;color:var(--ink-dim);padding:10px 12px;min-height:42px;border-radius:8px;font-weight:700;font-size:14.5px;text-align:left;display:flex;justify-content:space-between;gap:10px}
  .lang-switch button:hover{background:var(--panel2);color:var(--ink)}
  .lang-switch button[aria-pressed="true"]{color:var(--fox);background:var(--panel2)}
  .lang-switch button small{font-size:12px;opacity:.7}

  /* ---------- bố cục danh mục ---------- */
  .wrap{position:relative;z-index:1;width:min(1440px,100%);margin:0 auto;padding:0 32px}
  .catalog-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-top:36px;align-items:start}
  .sidebar{position:sticky;top:96px}
  .side-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
  .side-list{display:flex;flex-direction:column}
  .side-list button{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);padding:12px 2px;min-height:46px;font-weight:600;font-size:15.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .side-list button:hover{color:var(--fox)}
  .side-list button[aria-pressed="true"]{color:var(--fox)}
  .side-list button .cnt{font-size:12px;color:var(--ink-faint);font-weight:700}

  .hero h1{font-size:clamp(32px,4.4vw,54px);margin:0 0 14px}
  .hero .lede{max-width:860px;color:var(--ink-dim);font-size:16px;margin:0}

  .cat-section{margin-top:48px}
  .cat-section h2{font-size:clamp(24px,2.6vw,32px);margin:0 0 18px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .p-card{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;width:100%;color:var(--ink);background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;transition:transform .15s ease,border-color .15s ease}
  .p-card .art-wrap{position:relative;height:190px;overflow:hidden}
  .p-card .art{width:100%;height:100%;object-fit:cover}
  .p-card .art-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,23,27,0) 35%,var(--panel) 92%)}
  .p-card h3{position:absolute;left:16px;right:16px;bottom:6px;z-index:1;margin:0;font-size:19px}
  .p-card .cbody{position:relative;z-index:1;margin-top:-2px;background:var(--panel);padding:12px 16px 16px;display:flex;flex-direction:column;flex:1}
  .p-card ul{list-style:none;margin:0 0 16px;padding:0}
  .p-card ul li{font-size:13px;font-weight:500;color:var(--ink-dim);padding-left:15px;position:relative;margin-bottom:4px}
  .p-card ul li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--fox)}
  .p-card .cfoot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .price{display:flex;flex-direction:column;line-height:1.2}
  .price small{font-size:11.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .price b{font-size:15px;font-weight:800}
  .order-btn{background:var(--fox);color:#160b03;border-radius:10px;font-weight:800;font-size:14.5px;padding:11px 18px;min-height:44px;display:inline-flex;align-items:center}
  .p-card:hover .order-btn{background:#ff8a42}
  .no-results{color:var(--ink-faint);font-size:15.5px;padding:24px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center;margin-top:36px}

  /* ---------- khung đặt đơn theo yêu cầu ---------- */
  .custom-offer{position:relative;overflow:hidden;margin-top:56px;border-radius:24px;background:var(--panel);border:1px solid var(--line-soft);min-height:260px;display:flex;align-items:center}
  .custom-offer img{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover}
  .custom-offer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--panel) 42%,rgba(23,23,27,.55) 70%,rgba(23,23,27,.1))}
  .custom-offer .co-text{position:relative;z-index:1;padding:40px 48px;max-width:560px}
  .co-kicker{margin:0 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .custom-offer h2{font-size:clamp(26px,3vw,36px);margin:0 0 12px}
  .custom-offer p{margin:0 0 22px;color:var(--ink-dim);font-size:15px}
  .co-actions{display:flex;flex-wrap:wrap;gap:10px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;min-height:48px;padding:12px 20px;border-radius:10px;font-weight:800;font-size:15px;border:1px solid transparent}
  .btn-primary{background:var(--fox);color:#160b03}
  .btn-primary:hover{background:#ff8a42}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink-faint)}

  /* ---------- phần thông tin (dành cho ai, cách hoạt động, hỏi đáp) ---------- */
  .info{margin-top:56px;background:var(--bg2);border:1px solid var(--line-soft);border-radius:24px;padding:40px 48px}
  .info h2{font-size:clamp(22px,2.4vw,28px);margin:0 0 14px}
  .info section + section{margin-top:40px;padding-top:36px;border-top:1px solid var(--line-soft)}
  .info p{color:var(--ink-dim);margin:0 0 14px;max-width:900px}
  .dot-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 32px}
  .dot-list li{position:relative;padding-left:20px;font-weight:600}
  .dot-list li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
  .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:step}
  .steps li{counter-increment:step;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px}
  .steps li::before{content:counter(step);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--panel3);font-weight:800;font-size:14px;margin-bottom:12px}
  .steps h3{font-size:16px;margin:0 0 6px}
  .steps p{font-size:14px;margin:0}
  .trust-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .trust-list li{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px}
  .trust-list h3{font-size:16px;margin:0 0 6px}
  .trust-list p{font-size:14px;margin:0}
  .faq details{border-bottom:1px solid var(--line-soft)}
  .faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-weight:700;font-size:16.5px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";font-size:22px;font-weight:400;color:var(--ink-faint);flex:0 0 auto}
  .faq details[open] summary::after{content:"−"}
  .faq details p{margin:0 0 18px}

  /* ---------- trang chi tiết dịch vụ ---------- */
  .crumbs{display:flex;align-items:center;gap:12px;padding:30px 0 4px;flex-wrap:wrap}
  .back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-soft);color:var(--ink);border-radius:10px;padding:9px 15px;min-height:42px;font-weight:700;font-size:14.5px}
  .back-btn:hover{border-color:var(--line)}
  .crumb-path{color:var(--ink-faint);font-size:14px}
  .crumb-path b{color:var(--ink-dim);font-weight:600}
  .detail-title{font-size:clamp(30px,4vw,46px);margin:10px 0 22px}
  .detail-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) 350px;gap:22px;align-items:start}
  .d-banner{position:relative;border-radius:var(--radius);overflow:hidden}
  .d-banner img{width:100%;height:340px;object-fit:cover}
  .d-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,0) 45%,rgba(11,11,13,.85))}
  .d-tags{position:absolute;left:14px;bottom:14px;z-index:1;display:flex;flex-wrap:wrap;gap:7px}
  .d-tags span{background:rgba(11,11,13,.75);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;padding:6px 11px;border-radius:8px}
  .d-flex{margin-top:14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px}
  .d-flex b{display:block;font-size:16px}
  .d-flex span{font-size:14px;color:var(--ink-dim)}
  .d-col h2{font-size:22px;margin:28px 0 10px}
  .d-col h2:first-child{margin-top:0}
  .d-col p.desc{color:var(--ink-dim);margin:0;font-size:15.5px}
  .get-list{list-style:none;margin:0;padding:0}
  .get-list li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:15.5px}
  .get-list li .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-size:13px;font-weight:800}
  .addon-list{list-style:none;margin:0;padding:0}
  .addon-list li{padding:6px 0 6px 16px;position:relative;font-size:15px;color:var(--ink-dim)}
  .addon-list li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--fox)}
  .req-table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden;font-size:14.5px}
  .req-table th{text-align:left;background:var(--panel2);padding:10px 14px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .req-table th:last-child,.req-table td:last-child{text-align:right}
  .req-table td{padding:8px 14px;border-top:1px solid var(--line-soft);color:var(--ink-dim)}
  .req-table td:last-child{color:var(--gold);font-weight:700;white-space:nowrap}
  .dungeon-pick{max-height:308px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--bg2)}
  .dungeon-pick .check-row{padding:7px 8px;min-height:40px;font-size:14.5px}
  .dungeon-pick .dlvl{color:var(--gold);font-weight:700;font-size:13.5px;white-space:nowrap}

  /* biểu mẫu */
  .form-panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:2px}
  .field label,.field .flabel{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
  .field .hint{font-weight:400;color:var(--ink-faint);font-size:13px}
  input[type="number"],input[type="text"],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;min-height:48px;font:inherit;font-size:15.5px}
  textarea{min-height:82px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--fox);outline:none}
  input[type="range"].lvl-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;border:0;padding:0;margin:4px 0 0;min-height:0;cursor:pointer}
  input[type="range"].lvl-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--panel3)}
  input[type="range"].lvl-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fox);margin-top:-7px}
  input[type="range"].lvl-range::-moz-range-track{height:6px;border-radius:999px;background:var(--panel3)}
  input[type="range"].lvl-range::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--fox)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fixed-target{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:11px 12px;min-height:48px;font-weight:700}
  .fixed-target span{color:var(--ink-faint);font-weight:500;font-size:13.5px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;min-height:48px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--ink-dim);font-weight:700;font-size:15px}
  .seg button[aria-pressed="true"]{border-color:var(--fox);color:var(--ink);background:rgba(240,118,42,.14)}
  .seg button.f-alliance[aria-pressed="true"]{border-color:var(--alliance);color:#8fc0f5;background:rgba(74,144,217,.13)}
  .seg button.f-horde[aria-pressed="true"]{border-color:var(--horde);color:#f59a8f;background:rgba(217,74,61,.13)}
  .field .error{display:none;color:var(--err);font-size:13.5px;margin-top:6px;font-weight:600}
  .field.invalid .error{display:block}
  .field.invalid input{border-color:var(--err)}
  .check-list{display:flex;flex-direction:column;gap:2px}
  .check-row,.radio-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;padding:9px 6px;min-height:44px;border-radius:8px;font-size:15px;color:var(--ink-dim);font-weight:600}
  .check-row:hover,.radio-row:hover{background:var(--panel2);color:var(--ink)}
  .box{flex:0 0 auto;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--ink-faint);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
  .radio-dot{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--ink-faint);display:grid;place-items:center}
  .radio-dot::after{content:"";width:11px;height:11px;border-radius:50%;background:transparent}
  .check-row[aria-checked="true"],.radio-row[aria-checked="true"]{color:var(--ink)}
  .check-row[aria-checked="true"] .box{background:var(--fox);border-color:var(--fox)}
  .radio-row[aria-checked="true"] .radio-dot{border-color:var(--fox)}
  .radio-row[aria-checked="true"] .radio-dot::after{background:var(--fox)}

  /* khung tóm tắt đơn */
  .order-panel{position:sticky;top:96px;border-radius:var(--radius);padding:22px;background:var(--panel);border:1px solid var(--line)}
  .op-brand{display:flex;align-items:center;gap:11px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .op-brand img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  .op-bname{font-weight:800;font-size:16px;line-height:1.1}
  .op-bsub{font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .order-panel h3{margin:0 0 14px;font-size:19px}
  .op-label{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px}
  .stepper{display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .stepper button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:21px;font-weight:800;display:grid;place-items:center}
  .stepper button:hover{border-color:var(--ink-faint)}
  .stepper button:disabled{opacity:.4;cursor:default}
  .stepper .val{flex:1;text-align:center;font-size:19px;font-weight:800;background:var(--bg2);border-radius:10px;padding:10px 0}
  .speed-list{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
  .speed-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:11px 12px;min-height:46px;font-weight:700;font-size:15px}
  .speed-row[aria-checked="true"]{border-color:var(--fox)}
  .speed-row[aria-checked="true"] .radio-dot{border-color:var(--fox)}
  .speed-row[aria-checked="true"] .radio-dot::after{background:var(--fox)}
  .op-sum{border-top:1px solid var(--line-soft);padding-top:12px;margin-bottom:6px}
  .op-sum ul{list-style:none;margin:0;padding:0}
  .op-sum li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--line-soft)}
  .op-sum li span:first-child{color:var(--ink-faint)}
  .op-sum li span:last-child{font-weight:700;text-align:right}
  .op-sum .empty{color:var(--ink-faint);font-size:14px;margin:0}
  .op-total{background:rgba(240,118,42,.1);border:1px solid rgba(240,118,42,.35);border-radius:12px;padding:13px 14px;margin:14px 0 10px}
  .op-total .t-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 4px}
  .op-total p{margin:0;font-size:16.5px;font-weight:800;line-height:1.35}
  .op-pay{font-size:13.5px;color:var(--ink-dim);margin:0 0 14px}
  .op-pay b{color:var(--ink)}
  .order-panel .btn{width:100%}
  .order-panel .btn + .btn{margin-top:9px}
  .btn-copy{background:var(--ink);color:#111}
  .btn-copy:hover{background:#fff}
  .copy-note{font-size:13.5px;color:var(--gold);min-height:19px;margin:8px 0 0;text-align:center;font-weight:600}

function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function pData(p){ return p.i18n[lang] || p.i18n.en; }

/* ================= sidebar ================= */
var sideList = document.getElementById("sideList");
function catCount(c){ if(c==="all") return PRODUCTS.length; var n=0; PRODUCTS.forEach(function(p){ if(p.cats.indexOf(c)>=0) n++; }); return n; }
function renderSidebar(){
  sideList.innerHTML = "";
  CATEGORIES.forEach(function(c){
    var b = el("button",null);
    b.type = "button";
    b.setAttribute("aria-pressed", state.cat===c ? "true":"false");
    b.appendChild(el("span",null,t("cat_"+c)));
    b.appendChild(el("span","cnt",String(catCount(c))));
    b.addEventListener("click", function(){ state.cat = c; state.query=""; document.getElementById("searchInput").value=""; renderSidebar(); renderCatalog(); fxObserve(); });
    sideList.appendChild(b);
  });
}

/* ================= catalog ================= */
var catalogMain = document.getElementById("catalogMain");
function productCard(p){
  var d = pData(p);
  var card = el("button","p-card"); card.type="button";
  var art = el("div","art-wrap");
  var img = el("img","art"); img.src=p.img; img.alt=p.alt; img.loading="lazy";
  art.appendChild(img);
  art.appendChild(el("h3",null,d.name));
  card.appendChild(art);
  var body = el("div","cbody");
  var ul = el("ul");
  d.bullets.forEach(function(x){ ul.appendChild(el("li",null,x)); });
  body.appendChild(ul);
  var foot = el("div","cfoot");
  var price = el("span","price");
  price.appendChild(el("small",null,t("price_label")));
  price.appendChild(el("b",null,t("price_value")));
  foot.appendChild(price);
  foot.appendChild(el("span","order-btn",t("order_btn")));
  body.appendChild(foot);
  card.appendChild(body);
  card.addEventListener("click", function(){ openProduct(p.id); });
  return card;
}
function sectionEl(title, list){
  var s = el("div","cat-section");
  s.appendChild(el("h2",null,title));
  var g = el("div","card-grid");
  list.forEach(function(p){ g.appendChild(productCard(p)); });
  s.appendChild(g);
  return s;
}
function renderCatalog(){
  catalogMain.innerHTML = "";
  var q = state.query.trim().toLowerCase();
  if(q){
    var res = PRODUCTS.filter(function(p){
      var d = pData(p), e = p.i18n.en;
      var hay = (d.name+" "+e.name+" "+d.bullets.join(" ")).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    if(!res.length){ catalogMain.appendChild(el("div","no-results",t("no_results"))); return; }
    catalogMain.appendChild(sectionEl(t("sec_results"), res));
    return;
  }
  // Cày cấp (mục mặc định khi mở trang) có thêm Ưu đãi nổi bật ở trên
  if(state.cat === "powerleveling") catalogMain.appendChild(sectionEl(t("sec_top"), PRODUCTS.filter(function(p){ return p.featured; })));
  if(state.cat !== "all"){
    var list = PRODUCTS.filter(function(p){ return p.cats.indexOf(state.cat)>=0; });
    catalogMain.appendChild(sectionEl(t("cat_"+state.cat), list));
    return;
  }
  var feat = PRODUCTS.filter(function(p){ return p.featured; });
  catalogMain.appendChild(sectionEl(t("sec_top"), feat));
  CATEGORIES.filter(function(c){ return c!=="all"; }).forEach(function(c){
    var list = PRODUCTS.filter(function(p){ return p.cat===c; });
    if(list.length) catalogMain.appendChild(sectionEl(t("cat_"+c), list));
  });
}

/* ================= detail: form ================= */
var formPanel = document.getElementById("formPanel");
function fieldWrap(labelText){
  var w = el("div","field");
  w.appendChild(el("label",null,labelText));
  return w;
}
function selectField(labelText, options, current, onChange, firstLabel){
  var w = fieldWrap(labelText);
  var sel = el("select"); sel.setAttribute("aria-label", labelText);
  if(firstLabel != null){ var o0 = el("option",null,firstLabel); o0.value=""; sel.appendChild(o0); }
  options.forEach(function(o){
    var oEl = el("option",null,o.label); oEl.value=o.value;
    if(current===o.value) oEl.selected = true;
    sel.appendChild(oEl);
  });
  sel.addEventListener("change", function(){ onChange(sel.value); });
  w.appendChild(sel);
  return w;
}
function segField(labelText, options, current, onPick){
  var w = el("div","field");
  w.appendChild(el("span","flabel",labelText));
  var seg = el("div","seg");
  options.forEach(function(o){
    var b = el("button",null,o.label); b.type="button";
    if(o.cls) b.className = o.cls;
    b.setAttribute("aria-pressed", current===o.value ? "true":"false");
    b.addEventListener("click", function(){ onPick(o.value); });
    seg.appendChild(b);
  });
  w.appendChild(seg);
  return w;
}
function checkListField(labelText, options, selectedArr, onToggle){
  var w = el("div","field");
  w.appendChild(el("span","flabel",labelText));
  var list = el("div","check-list");
  options.forEach(function(o){
    var on = selectedArr.indexOf(o.value)>=0;
    var b = el("button","check-row"); b.type="button";
    b.setAttribute("role","checkbox"); b.setAttribute("aria-checked", on?"true":"false");
    b.appendChild(el("span","box", on?"✓":""));
    b.appendChild(el("span",null,o.label));
    b.addEventListener("click", function(){ onToggle(o.value); });
    list.appendChild(b);
  });
  w.appendChild(list);
  return w;
}
function radioField(labelText, options, current, onPick, rowCls){
  var w = el("div","field");
  w.appendChild(el("span","flabel",labelText));
  var list = el("div","check-list");
  options.forEach(function(o){
    var on = current===o.value;
    var b = el("button", rowCls||"radio-row"); b.type="button";
    b.setAttribute("role","radio"); b.setAttribute("aria-checked", on?"true":"false");
    b.appendChild(el("span","radio-dot"));
    b.appendChild(el("span",null,o.label));
    b.addEventListener("click", function(){ onPick(o.value); });
    list.appendChild(b);
  });
  w.appendChild(list);
  return w;
}
function rerender(){ var p = findProduct(state.product); if(p){ renderForm(p); renderPanel(p); } }
function validateLevels(){
  if(state.product==null) return;
  var p = findProduct(state.product); if(!p || p.type!=="leveling") return;
  var it = document.getElementById("targetInput"); if(!it) return;
  var wrap = it.closest(".field");
  var c = parseInt(state.current,10), tg = parseInt(state.target,10);
  var bad = false;
  if(!isNaN(c) && !isNaN(tg) && (tg<=c || tg>60 || c<1)) bad = true;
  if(!isNaN(tg) && tg>60) bad = true;
  wrap.classList.toggle("invalid", bad);
}
function validateSkill(){
  var it = document.getElementById("skillInput"); if(!it) return;
  var wrap = it.closest(".field");
  var v = parseInt(state.skill,10);
  var bad = state.skill!=="" && (isNaN(v) || v<0 || v>299);
  wrap.classList.toggle("invalid", bad);
}

/* ================= summary ================= */
function summaryRows(){
  var rows = [];
  var p = findProduct(state.product); if(!p) return rows;
  rows.push([t("s_service"), pName(p)]);
  if(p.type==="leveling"){
    if(state.current) rows.push([t("s_current"), state.current]);
    if(state.target) rows.push([t("s_target"), state.target]);
    if(state.prof1) rows.push([t("s_prof1"), state.prof1]);
    if(state.prof2) rows.push([t("s_prof2"), state.prof2]);
    if(state.secondary.length) rows.push([t("s_secondary"), state.secondary.join(", ")]);
    if(state.extras.length) rows.push([t("s_extras"), state.extras.map(function(v){ var l=v; EXTRAS.forEach(function(x){ if(x.v===v) l=t(x.k); }); return l; }).join(", ")]);
  }
  if(p.type==="dungeons"){
    var picks = state.dungeonMode==="tier" ? state.tiers : state.dungeons;
    if(picks.length) rows.push([dx("s_dungeons"), picks.join(", ")]);
    if(state.runs) rows.push([t("s_runs"), state.runs]);
    if(state.loot) rows.push([dx("s_loot"), dx(state.loot==="group" ? "loot_group" : "loot_priority")]);
    if(state.method) rows.push([dx("s_method"), dx(state.method==="self" ? "method_self" : state.method==="piloted" ? "method_piloted" : "method_remote")]);
  }
  if(p.type==="profession"){
    if(state.profession) rows.push([t("s_profession"), state.profession]);
    if(state.skill!=="") rows.push([t("s_skill"), state.skill+" → 300"]);
  }
  if(p.type==="riding" && state.riding) rows.push([t("s_riding"), state.riding+"%"]);
  if(p.type==="hourly"){
    if(state.hours) rows.push([t("s_hours"), state.hours]);
    if(state.activity.trim()) rows.push([t("s_request"), state.activity.trim()]);
  }
  if(p.type==="gearing" && state.gear) rows.push([t("s_gear"), t(state.gear==="pre" ? "gear_pre" : "gear_bis")]);
  if(p.type==="goal" && state.goal.trim()) rows.push([t("s_request"), state.goal.trim()]);
  if(state.cls) rows.push([t("s_class"), state.cls]);
  if(state.faction) rows.push([t("s_faction"), state.faction]);
  if(state.ruleset) rows.push([t("s_ruleset"), rulesetLabel(state.ruleset)]);
  rows.push([t("s_chars"), String(state.chars)]);
  rows.push([t("s_speed"), t("speed_"+state.speed)]);
  if(state.notes.trim()) rows.push([t("s_notes"), state.notes.trim()]);
  return rows;
}
function rulesetLabel(v){ var l=v; RULESETS.forEach(function(r){ if(r.v===v) l=t(r.k); }); return l; }
function summaryText(){
  var lines = [t("copy_head")];
  summaryRows().forEach(function(r){ lines.push(r[0]+": "+r[1]); });
  return lines.join("\n");
}

  var sum = el("div","op-sum");

  var copyBtn = el("button","btn btn-copy"); copyBtn.type="button";

  orderPanel.appendChild(cta);

  chat.appendChild(el("span",null,t("chat_before")));
  orderPanel.appendChild(chat);
}
function doCopy(){
  var text = summaryText();
  function done(){ copyMsg = t("copied"); refreshNote(); }
  function fail(){ copyMsg = t("copy_fail"); refreshNote(); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text) ? done() : fail(); });
  } else { fallbackCopy(text) ? done() : fail(); }
}
function refreshNote(){ var n = document.getElementById("copyNote"); if(n) n.textContent = copyMsg; }
function fallbackCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang = lang;
  var sg = document.getElementById("sloganText"); if(sg) sg.textContent = SLOGANS[lang] || SLOGANS.en;
  document.querySelectorAll("[data-i18n]").forEach(function(n){ n.textContent = t(n.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(function(n){ n.innerHTML = t(n.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(n){ n.setAttribute("placeholder", t(n.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll(".lang-switch button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang ? "true":"false");
  });
  document.getElementById("langCode").textContent = {en:"EN", vi:"VI", id:"ID", fil:"PH", ru:"RU"}[lang];
  var who = document.getElementById("whoList"); who.innerHTML = "";
  t("who_list").split("|").forEach(function(x){ who.appendChild(el("li",null,x)); });
  copyMsg = "";
  renderSidebar(); renderCatalog();
  if(window.fxObserve) fxObserve();
  if(state.product){
    var p = findProduct(state.product);
    document.getElementById("detailTitle").textContent = pName(p);
    document.getElementById("crumbCat").textContent = t("cat_"+p.cat);
    document.getElementById("crumbName").textContent = pName(p);
    renderDetailLeft(p); renderForm(p); renderPanel(p);
  }
}

var langBtn = document.getElementById("langBtn"), langList = document.getElementById("langList");
function setLangOpen(open){ langList.hidden = !open; langBtn.setAttribute("aria-expanded", open ? "true":"false"); }

/* ================= hiệu ứng cuộn ================= */
// Thẻ và các khối hiện dần khi cuộn tới (thẻ trong cùng lưới lệch nhau một chút),
// ảnh nền đầu trang trôi chậm hơn nội dung, thanh trên đậm lại khi đã cuộn.
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var io = (!reduceMotion && "IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
}, {rootMargin:"0px 0px -8% 0px", threshold:.08}) : null;
function fxObserve(){
  if(!io) return;
  document.documentElement.classList.add("fx");
  var groups = [".hero > *", ".cat-section > h2", ".card-grid", ".custom-offer", ".info > section > h2", ".info > section > p", ".dot-list li", ".steps li", ".trust-list li", ".faq details"];
  groups.forEach(function(sel){
    document.querySelectorAll(sel).forEach(function(n, i){
      if(n.classList.contains("card-grid")){
        Array.prototype.forEach.call(n.children, function(c, j){ fxAdd(c, (j % 4) * 90); });
      } else fxAdd(n, sel.indexOf("li")>=0 || sel===".hero > *" || sel===".faq details" ? Math.min(i, 7) * 70 : 0);
    });
  });
}
function fxAdd(n, delay){
  if(n.classList.contains("reveal")) return;
  n.classList.add("reveal"); n.style.setProperty("--d", delay + "ms");
  io.observe(n);
}
window.fxObserve = fxObserve;
var topbar = document.querySelector(".topbar"), pageArt = document.querySelector(".page-art img"), ticking = false;
function onScroll(){
  var y = window.scrollY;
  topbar.classList.toggle("scrolled", y > 8);
  if(pageArt && !reduceMotion && y < 900){ pageArt.style.transform = "translateY(" + (y * 0.35) + "px) scale(" + (1 + y * 0.00015) + ")"; pageArt.style.opacity = String(Math.max(0, .36 - y * 0.00036)); }
  ticking = false;
}
window.addEventListener("scroll", function(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
onScroll();

// Link từ trang WoW Forever: ?svc=<mã dịch vụ> mở thẳng sản phẩm, ?lang=vi|en|id|fil chọn ngôn ngữ

if(SLOGANS[qs.get("lang")]) lang = qs.get("lang");
applyLang();

if(svcId && PRODUCTS.some(function(p){ return p.id===svcId; })) openProduct(svcId);
})();
